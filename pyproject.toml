[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sphere-on-a-torus"
version = "0.1.0"
description = "Local shallow-water numerics for a sphere on a periodic processor grid"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = ["numpy==2.4.6", "scipy==1.18.0", "numba==0.65.1"]

[project.optional-dependencies]
check = ["pytest==9.1.1"]
figures = ["matplotlib==3.11.1", "pillow==12.2.0"]
optimise = ["cvxpy"]

[tool.setuptools]
packages = ["polarswe"]

[tool.setuptools.package-data]
polarswe = ["kg_coeffs.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
